openapi: 3.0.3
info:
  title: Kapmeta Reporting API
  description: Day Summary + Item Report screen backing API, including per-user persisted column preferences ("Configure Column").
  version: "1.0.0"
servers:
  - url: https://api.kapmeta.com/v1
security:
  - BearerAuth: []
paths:
  /reports/day-summary:
    get:
      operationId: getDaySummaryReport
      summary: Get day summary report for a date range
      tags: [Reporting]
      x-required-role: manager
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Day summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySummaryReport'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
  /reports/item-report:
    get:
      operationId: getItemReport
      summary: Get item-level sales report for a date range
      tags: [Reporting]
      x-required-role: manager
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          description: Dimension to group item rows by.
          schema:
            type: string
            enum: [item, category, channel]
            default: item
        - name: columns
          in: query
          description: Comma-separated list of column keys to include in the response (mirrors persisted report_preferences if omitted).
          schema:
            type: string
            example: "quantity_sold,gross_sales,discount_amount,net_sales"
      responses:
        '200':
          description: Item report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemReport'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
  /report-preferences:
    get:
      operationId: getReportPreferences
      summary: Get the current user's persisted report column preferences
      tags: [Reporting]
      x-required-role: manager
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [item_report, day_summary]
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPreferences'
        '404':
          description: No saved preferences; caller should use report defaults.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
    put:
      operationId: putReportPreferences
      summary: Save the current user's report column preferences
      tags: [Reporting]
      x-required-role: manager
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPreferencesUpsertRequest'
      responses:
        '200':
          description: Preferences saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPreferences'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
components:
  schemas:
    DaySummaryReport:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        total_orders:
          type: integer
        gross_sales_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        discount_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        tax_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        net_sales_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        cancelled_orders:
          type: integer
        by_channel:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              order_count:
                type: integer
              net_sales_amount:
                $ref: 'common.yaml#/components/schemas/Money'
        by_payment_type:
          type: array
          items:
            type: object
            properties:
              payment_type:
                type: string
              amount:
                $ref: 'common.yaml#/components/schemas/Money'
    ItemReportRow:
      type: object
      properties:
        group_key:
          type: string
          description: Item name, category name, or channel name, depending on groupBy.
        quantity_sold:
          type: integer
        gross_sales_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        discount_amount:
          $ref: 'common.yaml#/components/schemas/Money'
        net_sales_amount:
          $ref: 'common.yaml#/components/schemas/Money'
    ItemReport:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        groupBy:
          type: string
          enum: [item, category, channel]
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ItemReportRow'
    ReportPreferences:
      type: object
      required: [report, columns]
      properties:
        report:
          type: string
          enum: [item_report, day_summary]
        columns:
          type: array
          description: Ordered list of visible column keys.
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    ReportPreferencesUpsertRequest:
      type: object
      required: [report, columns]
      properties:
        report:
          type: string
          enum: [item_report, day_summary]
        columns:
          type: array
          items:
            type: string
