openapi: 3.1.0
info:
  title: Kapmeta — Reporting API
  version: 1.0.0
  license:
    name: Proprietary
  summary: Operational (real-time) reporting layer only — live order counts, pending KOT counts, integration failure counts. Historical/sales/finance reporting is OUT OF SCOPE.
  description: |
    Traces to `docs/02-requirements/reporting.md`. Conventions in `docs/06-api/api-standards.md`;
    shared components in `common.yaml`.

    ## BLOCKED — DEC-009 (KPI formulas not signed off)

    `reporting.md` lists eight reporting layers. Layer 1 ("Operational (real-time) — live orders,
    pending KOTs, integration failures") is queries against transactional tables with tight filters
    and no derived business math. Layers 2-8 (Sales, Payment, Inventory, Purchase, Finance, Customer,
    Management) all read pre-aggregated summary tables whose formulas — Gross Sales, Net Sales, AOV,
    Top Items, Payment Mix, KOT Duration and everything downstream of them — are explicitly marked
    "proposed until DEC-009 signs off," with the document's own warning: "Two stakeholders disagreeing
    on 'net sales' after go-live is a reconciliation incident, not a bug."

    This spec therefore covers ONLY Layer 1. Layers 2-8 are entirely absent, not just their fields.

    OUT OF SCOPE, and why — every one of these is BLOCKED on DEC-009, not merely unwritten:

      - **Any endpoint returning `gross_sales`, `net_sales`, AOV, or a revenue figure of any kind.**
        The formulas for these (e.g. "Gross − discounts − refunds, tax treatment to confirm") are
        proposed, not agreed, and additionally depend on DEC-004 (tax) and DEC-008 (discounts).
      - **Top Items.** Even the ranking basis (`RANK BY quantity OR revenue`) is unresolved per the
        source table ("confirm which").
      - **Payment Mix / reconciliation reporting.** Method-wise and settlement-status reporting is
        Layer 3 and additionally depends on `payments.yaml`, itself BLOCKED on DEC-005.
      - **KOT Duration and other prep-time KPIs.** `AVG(completed_at - created_at)` is a Layer-1-
        adjacent number but the requirements doc places it in the KPI table alongside the sales
        formulas awaiting DEC-009 sign-off; it is not exposed until the KPI layer as a whole is
        confirmed.
      - **Inventory, Purchase, Finance and Customer/CRM reporting layers.** Layers 4, 5, 6 and 7. Layer
        4 additionally depends on `inventory.yaml`'s consumption data, BLOCKED on DEC-003; Layer 6
        additionally depends on tax (DEC-004).
      - **Pre-aggregated summary table exposure** (`daily_sales_summary`, `hourly_sales_summary`,
        `item_sales_summary`, `payment_summary`, `kot_performance`). These tables encode the very
        formulas DEC-009 has not signed off; no endpoint reads them here.
      - **Exports.** No CSV/PDF export endpoints — export scope tracks whatever report content is
        eventually approved.

    IN SCOPE: counts of currently-existing rows in transactional tables, with no derived arithmetic
    beyond `COUNT()` and no revenue figure anywhere in this file. Each endpoint here is a thin,
    tightly-filtered read that `orders.yaml` / `kitchen.yaml` / `webhooks.yaml`'s underlying tables
    already expose individually — this spec adds count rollups for dashboard tiles only.

servers:
  - url: https://api.kapmeta.example.com/api/v1
    description: Production
  - url: https://staging-api.kapmeta.example.com/api/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Operational
    description: Real-time operational counts — live orders, pending KOTs, integration failures.

paths:

  /reporting/operational/order-counts:
    get:
      tags: [Operational]
      operationId: getLiveOrderCounts
      summary: Live order counts by status
      description: |
        `COUNT(orders)` grouped by `status` (`DB-ENUM-01`) for the current business date, scoped to
        the session's outlet. No revenue figure, no AOV, no "qualifying states" business rule beyond a
        plain count — those await DEC-009.

        Permission required: `reporting.read`.
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - $ref: 'common.yaml#/components/parameters/CorrelationIdHeader'
        - name: business_date
          in: query
          description: Defaults to the outlet's current business date (`fn_business_date`).
          schema: { $ref: 'common.yaml#/components/schemas/BusinessDate' }
      responses:
        '200':
          description: Order counts by status.
          headers:
            X-Correlation-Id: { $ref: 'common.yaml#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderCountsByStatus' }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /reporting/operational/kot-counts:
    get:
      tags: [Operational]
      operationId: getPendingKotCounts
      summary: Pending / open KOT ticket counts by station and status
      description: |
        `COUNT(kot_tickets)` grouped by `station_id` and `status` (`DB-ENUM-04`), for OPEN tickets
        (`PENDING`, `PREPARING`) by default. No KOT Duration figure (`AVG(completed_at - created_at)`)
        is included — that KPI is listed in `reporting.md` alongside the sales formulas awaiting
        DEC-009 and is not exposed here.

        Permission required: `reporting.read`.
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - $ref: 'common.yaml#/components/parameters/CorrelationIdHeader'
        - name: status
          in: query
          description: Repeatable. Defaults to `PENDING,PREPARING`.
          schema:
            type: array
            items: { $ref: 'common.yaml#/components/schemas/KotStatus' }
          style: form
          explode: true
      responses:
        '200':
          description: KOT counts by station and status.
          headers:
            X-Correlation-Id: { $ref: 'common.yaml#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KotCountsByStation' }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /reporting/operational/integration-failure-counts:
    get:
      tags: [Operational]
      operationId: getIntegrationFailureCounts
      summary: Integration failure counts by channel and stage
      description: |
        `COUNT(inbound_events)` in a failed/quarantined/dead-lettered state, grouped by
        `channel_account_id` and failure stage (quarantine, DLQ), per `docs/07-integration/integration-hub.md`
        and `docs/workflows/WF-INT-integration.md`. Feeds the "integration failures" tile on the
        operational dashboard. No reconciliation or settlement-matching figures — those are Layer 3
        (Payment reconciliation), out of scope.

        Permission required: `reporting.read`.
      parameters:
        - $ref: 'common.yaml#/components/parameters/OutletIdHeader'
        - $ref: 'common.yaml#/components/parameters/CorrelationIdHeader'
        - name: since
          in: query
          description: Defaults to the start of the current business date.
          schema: { $ref: 'common.yaml#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Integration failure counts.
          headers:
            X-Correlation-Id: { $ref: 'common.yaml#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationFailureCounts' }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    OrderCountsByStatus:
      type: object
      description: Plain counts. No revenue, no AOV, no derived business math.
      required: [outlet_id, business_date, counts, total, as_of]
      properties:
        outlet_id: { $ref: 'common.yaml#/components/schemas/Uuid' }
        business_date: { $ref: 'common.yaml#/components/schemas/BusinessDate' }
        counts:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { $ref: 'common.yaml#/components/schemas/OrderStatus' }
              count: { type: integer, minimum: 0 }
        total:
          type: integer
          minimum: 0
          description: Sum of `counts[].count`. Not to be confused with Order Count KPI, which awaits DEC-009's "qualifying states" definition.
        as_of: { $ref: 'common.yaml#/components/schemas/Timestamp' }

    KotCountsByStation:
      type: object
      required: [outlet_id, stations, as_of]
      properties:
        outlet_id: { $ref: 'common.yaml#/components/schemas/Uuid' }
        stations:
          type: array
          items:
            type: object
            required: [station_id, station_name, counts]
            properties:
              station_id: { $ref: 'common.yaml#/components/schemas/Uuid' }
              station_name: { type: string }
              counts:
                type: array
                items:
                  type: object
                  required: [status, count]
                  properties:
                    status: { $ref: 'common.yaml#/components/schemas/KotStatus' }
                    count: { type: integer, minimum: 0 }
        as_of: { $ref: 'common.yaml#/components/schemas/Timestamp' }

    IntegrationFailureCounts:
      type: object
      required: [outlet_id, channels, as_of]
      properties:
        outlet_id: { $ref: 'common.yaml#/components/schemas/Uuid' }
        channels:
          type: array
          items:
            type: object
            required: [channel_account_id, channel_type, quarantined_count, dead_lettered_count]
            properties:
              channel_account_id: { $ref: 'common.yaml#/components/schemas/Uuid' }
              channel_type: { $ref: 'common.yaml#/components/schemas/ChannelType' }
              quarantined_count:
                type: integer
                minimum: 0
                description: Events stopped at the unknown-item-mapping step (`WF-INT-01`).
              dead_lettered_count:
                type: integer
                minimum: 0
                description: Events that exhausted retry per `WF-INT-03` and reached the DLQ.
        as_of: { $ref: 'common.yaml#/components/schemas/Timestamp' }
